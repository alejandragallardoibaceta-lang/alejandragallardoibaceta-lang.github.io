<script type="text/x-dc">
class Component extends DCLogic {
renderVals() {
var self = this;
var o = this._pageVals();
var m = !!(this.state && this.state.menuOpen);
o.menuOpen = m;
o.menuExpanded = m ? 'true' : 'false';
o.toggleMenu = function (e) { self._menuToggle(e); };
o.goCat = function (e) { self._goCat(e); self._readCat && self._readCat(); };
return o;
}
componentDidMount() {
this._menuMount();
}
componentWillUnmount() {
this._menuUnmount();
}
_menuMount() {
var self = this;
this._onKey = function (e) {
if (!(self.state && self.state.menuOpen)) return;
if (e.key === 'Escape') { self.setState({ menuOpen: false }); if (self._menuBtn) { try { self._menuBtn.focus(); } catch (_) {} } return; }
if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
var wrap = self._menuBtn && self._menuBtn.closest('[data-menu-wrap]');
var items = wrap ? Array.prototype.slice.call(wrap.querySelectorAll('[role="menuitem"]')) : [];
if (!items.length) return;
var i = items.indexOf(document.activeElement);
var n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
items[n].focus(); e.preventDefault();
}
};
this._onDown = function (e) {
if (!(self.state && self.state.menuOpen)) return;
var t = e.target;
if (t && t.closest && t.closest('[data-menu-wrap]')) return;
self.setState({ menuOpen: false });
};
document.addEventListener('keydown', this._onKey);
document.addEventListener('mousedown', this._onDown);
}
_menuUnmount() {
document.removeEventListener('keydown', this._onKey);
document.removeEventListener('mousedown', this._onDown);
}
_menuToggle(e) {
var open = !(this.state && this.state.menuOpen);
if (e && e.currentTarget) { this._menuBtn = e.currentTarget; }
this.setState({ menuOpen: open });
var btn = this._menuBtn;
if (open && btn) {
setTimeout(function () { var wrap = btn.closest('[data-menu-wrap]'); var first = wrap && wrap.querySelector('[role="menuitem"]'); if (first) { first.focus(); } }, 40);
}
}
_goCat(e) {
try {
var id = e && e.currentTarget && e.currentTarget.getAttribute('data-cat');
if (id) { window.localStorage.setItem('dtparts.cat', id + '|' + Date.now()); }
} catch (_) {}
if (this.state && this.state.menuOpen) { this.setState({ menuOpen: false }); }
}

return {};
}
}
