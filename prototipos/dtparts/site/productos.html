<style>
body{margin:0;background:#ffffff;font-family:Montserrat,-apple-system,"segoe ui",arial,sans-serif;color:#000000}
a{color:#ffffff}a:hover{color:#ff5f00}
::selection{background:#ff5f00;color:#000000}
:focus-visible{outline:3px solid #ff5f00;outline-offset:2px}
.pcard{position:relative;cursor:pointer}
.pcard .stretch::after{content:"";position:absolute;inset:0;z-index:1;border-radius:10px}

@media (min-width: 1100px){.fgrid{grid-template-columns:1.1fr 1fr 0.9fr 1.1fr 1.6fr !important}}
@media (max-width: 640px){.phbar{flex-direction:column !important;gap:4px !important}.phsep{display:none !important}.phmsg{justify-content:center}}
.phbar:hover .phcta{text-decoration-thickness:2px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.navlink:hover{color:#ff5f00}
.menuitem:hover,.menuitem:focus-visible{background:#f4f4f4}
.cta:hover{filter:brightness(1.08)}
.pill:hover{border-color:#132530}
.pcard:hover{box-shadow:0px 8px 20px 0px rgba(0,0,0,0.16)}
.vermas:hover{background:#042437}
.flink:hover{color:#ff5f00}

<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="width: 100%; min-height: 100vh; background: #ffffff; font-family: Montserrat, -apple-system, 'segoe ui', arial, sans-serif; color: #000000;">

<!-- BARRA SUPERIOR · AutoDay -->
<div role="region" aria-label="Campaña AutoDay" style="background: #1367fb; color: #ffffff;">

<img src="img/24a47ca0211ce972ec37627cdc553f8b.png" alt="AutoDay.cl" style="height: 20px; width: auto; display: block;">
<span class="phsep" aria-hidden="true" style="width: 1px; height: 18px; background: rgba(255,255,255,0.45);"></span>
<p class="phmsg" style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;"><strong style="font-size: 15px; font-weight: 700; font-style: italic; letter-spacing: 0.5px;">AHORRANDO ANDO.</strong><span style="font-weight: 700; letter-spacing: 1px;">2, 3 Y 4 DE NOVIEMBRE</span><span class="phcta" style="display: inline-flex; align-items: center; gap: 4px; font-weight: 700; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 3px;">VER OFERTAS<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span></p>
</a>
</div>

<!-- HEADER -->

<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; font-weight: 700; letter-spacing: 1px;">
<div data-menu-wrap="true" style="position: relative;">
<button type="button" onClick="{{toggleMenu}}" aria-label="Menú de categorías" aria-expanded="{{menuExpanded}}" aria-controls="menu-categorias" class="navlink" style="background: transparent; border: 0; color: #ffffff; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div id="menu-categorias" role="menu" aria-label="Categorías" style="position: absolute; top: calc(100% + 14px); left: 0; z-index: 40; width: 300px; background: #ffffff; border-radius: 8px; box-shadow: 0px 5px 7px 0px rgba(0,0,0,0.2), 0px 16px 40px 0px rgba(0,0,0,0.18); padding: 8px; display: flex; flex-direction: column;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #3f3f40; padding: 10px 14px 6px;">CATEGORÍAS</span>
<a role="menuitem" href="productos.html" data-cat="baterias" onClick="{{goCat}}" class="menuitem" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 6px; color: #000000; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0;">Baterías<span aria-hidden="true" style="color: #ff5f00;">›</span></a>
<a role="menuitem" href="productos.html" data-cat="neumaticos" onClick="{{goCat}}" class="menuitem" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 6px; color: #000000; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0;">Neumáticos<span aria-hidden="true" style="color: #ff5f00;">›</span></a>
<a role="menuitem" href="productos.html" data-cat="lubricantes" onClick="{{goCat}}" class="menuitem" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 6px; color: #000000; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0;">Lubricantes<span aria-hidden="true" style="color: #ff5f00;">›</span></a>
<a role="menuitem" href="productos.html" data-cat="generacion" onClick="{{goCat}}" class="menuitem" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 6px; color: #000000; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0;">Generación<span aria-hidden="true" style="color: #ff5f00;">›</span></a>
<a role="menuitem" href="productos.html" data-cat="turbos" onClick="{{goCat}}" class="menuitem" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 6px; color: #000000; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0;">Turbos<span aria-hidden="true" style="color: #ff5f00;">›</span></a>
<a role="menuitem" href="productos.html" data-cat="herramientas" onClick="{{goCat}}" class="menuitem" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 6px; color: #000000; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0;">Equipo y Herramientas<span aria-hidden="true" style="color: #ff5f00;">›</span></a>
<a role="menuitem" href="productos.html" data-cat="inyeccion" onClick="{{goCat}}" class="menuitem" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 6px; color: #000000; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0;">Inyección<span aria-hidden="true" style="color: #ff5f00;">›</span></a>
<a role="menuitem" href="productos.html" data-cat="todas" onClick="{{goCat}}" style="margin-top: 6px; display: flex; justify-content: center; align-items: center; padding: 12px 14px; border-radius: 8px; background: #ff5f00; color: #000000; text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 2px;">VER TODAS LAS OFERTAS</a>
</div>
</sc-if>
</div>
</nav>
<a href="index.html" aria-label="DTPARTS, ir al inicio" style="display: flex; flex: 0 0 auto;"><img src="img/6a262225f6593267ddc4d88edb47979b.png" alt="DTPARTS Diesel Turbo &amp; Autoparts" style="height: 46px; width: auto; display: block;"></a>

<button type="button" aria-label="Buscar" style="border: 0; background: #ffffff; padding: 0 14px; cursor: pointer; display: flex; align-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#132530" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</form>
<div style="display: flex; align-items: center; gap: 20px;">
<a href="#" aria-label="Carro de compras, 0 productos" style="color: #ffffff; position: relative; display: flex;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h2.6l2.3 10.5h10.8l2.1-7.5H6.2"></path><circle cx="9" cy="19" r="1.4"></circle><circle cx="17" cy="19" r="1.4"></circle></svg>
<span style="position: absolute; top: -6px; right: -8px; background: #ff5f00; color: #000000; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center;">0</span></a>
</div>
</div>

<h1 class="sr-only">Productos en venta especial</h1>

<div style="background: #042437; color: #ffffff; text-align: center; padding: 14px 16px; font-size: 18px; line-height: 21px; letter-spacing: 1px;">FILTRAR REPUESTO POR TIPO DE AUTOMÓVIL</div>
<div style="padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; align-items: end;">

<div style="display: flex; flex-direction: column; gap: 8px;"><label for="f-marca" style="font-size: 14px; font-weight: 700;">Marca</label><select id="f-marca" style="font-family: inherit; font-size: 14px; color: #6d6d6d; padding: 10px; border: 0; border-radius: 8px; background: #ffffff; box-shadow: 0px 4px 6px 0px rgba(0,0,0,0.1), 0px -4px 6px 0px rgba(0,0,0,0.05), 4px 0px 6px 0px rgba(0,0,0,0.05), -4px 0px 6px 0px rgba(0,0,0,0.05); min-height: 44px;"><option>Elige una opción</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="f-modelo" style="font-size: 14px; font-weight: 700;">Modelo</label><select id="f-modelo" style="font-family: inherit; font-size: 14px; color: #6d6d6d; padding: 10px; border: 0; border-radius: 8px; background: #ffffff; box-shadow: 0px 4px 6px 0px rgba(0,0,0,0.1), 0px -4px 6px 0px rgba(0,0,0,0.05), 4px 0px 6px 0px rgba(0,0,0,0.05), -4px 0px 6px 0px rgba(0,0,0,0.05); min-height: 44px;"><option>Elige una opción</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="f-anio" style="font-size: 14px; font-weight: 700;">Año</label><select id="f-anio" style="font-family: inherit; font-size: 14px; color: #6d6d6d; padding: 10px; border: 0; border-radius: 8px; background: #ffffff; box-shadow: 0px 4px 6px 0px rgba(0,0,0,0.1), 0px -4px 6px 0px rgba(0,0,0,0.05), 4px 0px 6px 0px rgba(0,0,0,0.05), -4px 0px 6px 0px rgba(0,0,0,0.05); min-height: 44px;"><option>Elige una opción</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="f-cil" style="font-size: 14px; font-weight: 700;">Cilindrada</label><select id="f-cil" style="font-family: inherit; font-size: 14px; color: #6d6d6d; padding: 10px; border: 0; border-radius: 8px; background: #ffffff; box-shadow: 0px 4px 6px 0px rgba(0,0,0,0.1), 0px -4px 6px 0px rgba(0,0,0,0.05), 4px 0px 6px 0px rgba(0,0,0,0.05), -4px 0px 6px 0px rgba(0,0,0,0.05); min-height: 44px;"><option>Elige una opción</option></select></div>

</div>
</form>
</section>

<section id="listado" style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 80px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
<div role="group" aria-label="Filtrar por categoría" style="display: flex; flex-wrap: wrap; gap: 10px;">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<sc-if value="{{c.active}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{c.pick}}" style="background: #163649; color: #ffffff; border: 1px solid #132530; border-radius: 8px; padding: 11px 18px; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; min-height: 44px;">{{c.label}}</button>
</sc-if>
<sc-if value="{{c.inactive}}" hint-placeholder-val="{{ true }}">
<button type="button" class="pill" aria-pressed="false" onClick="{{c.pick}}" style="background: #ffffff; color: #000000; border: 1px solid rgba(19,37,48,0.35); border-radius: 8px; padding: 11px 18px; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; min-height: 44px;">{{c.label}}</button>
</sc-if>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
<span style="font-size: 14px; color: #3f3f40;" aria-live="polite">{{count}} productos</span>
<label for="orden" class="sr-only">Ordenar por</label>
<select id="orden" style="font-family: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid rgba(19,37,48,0.35); border-radius: 8px; background: #ffffff; color: #000000; min-height: 44px;"><option>Ordenar: mayor descuento</option><option>Precio: menor a mayor</option><option>Precio: mayor a menor</option><option>Más vendidos</option></select>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px;">
