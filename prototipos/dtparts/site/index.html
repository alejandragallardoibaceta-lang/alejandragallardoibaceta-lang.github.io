<script type="text/x-dc">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { bIdx: 0, bInstant: false, bPaused: false, hIdx: 0, hPaused: false, hStopped: false, menuOpen: false };
}
componentDidMount() {
var self = this;

this._fTimer = setInterval(function () { self.setState({ now: Date.now() }); }, 1000);
this._bTimer = setInterval(function () {
if (!self.state.bPaused) { self.brandGo(1); }
}, 3000);
this._hTimer = setInterval(function () {
if (!self.state.hPaused && !self.state.hStopped) { self.setState({ hIdx: ((self.state.hIdx || 0) + 1) % 4 }); }
}, 6000);
}
componentWillUnmount() {
this._menuUnmount();
clearInterval(this._bTimer);
clearInterval(this._hTimer);
clearInterval(this._fTimer);
}
_menuMount() {
var self = this;
this._onKey = function (e) {
if (!(self.state && self.state.menuOpen)) return;
if (e.key === 'Escape') { self.setState({ menuOpen: false }); if (self._menuBtn) { try { self._menuBtn.focus(); } catch (_) {} } return; }
if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
var wrap = self._menuBtn && self._menuBtn.closest('[data-menu-wrap]');
var items = wrap ? Array.prototype.slice.call(wrap.querySelectorAll('[role="menuitem"]')) : [];
if (!items.length) return;
var i = items.indexOf(document.activeElement);
var n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
items[n].focus(); e.preventDefault();
}
};
this._onDown = function (e) {
if (!(self.state && self.state.menuOpen)) return;
var t = e.target;
if (t && t.closest && t.closest('[data-menu-wrap]')) return;
self.setState({ menuOpen: false });
};
document.addEventListener('keydown', this._onKey);
document.addEventListener('mousedown', this._onDown);
}
_menuUnmount() {
document.removeEventListener('keydown', this._onKey);
document.removeEventListener('mousedown', this._onDown);
}
_menuToggle(e) {
var open = !(this.state && this.state.menuOpen);
if (e && e.currentTarget) { this._menuBtn = e.currentTarget; }
this.setState({ menuOpen: open });
var btn = this._menuBtn;
if (open && btn) {
setTimeout(function () { var wrap = btn.closest('[data-menu-wrap]'); var first = wrap && wrap.querySelector('[role="menuitem"]'); if (first) { first.focus(); } }, 40);
}
}
_goCat(e) {
try {
var id = e && e.currentTarget && e.currentTarget.getAttribute('data-cat');
if (id) { window.localStorage.setItem('dtparts.cat', id + '|' + Date.now()); }
} catch (_) {}
if (this.state && this.state.menuOpen) { this.setState({ menuOpen: false }); }
}
brandGo(dir) {
var self = this;
var n = 7;
var idx = this.state.bIdx;
if (dir > 0) {
var nx = idx + 1;
this.setState({ bIdx: nx, bInstant: false });
if (nx >= n) {
setTimeout(function () { self.setState({ bIdx: 0, bInstant: true }); }, 520);
}
} else {
if (idx <= 0) {
this.setState({ bIdx: n, bInstant: true });
setTimeout(function () { self.setState({ bIdx: n - 1, bInstant: false }); }, 30);
} else {
this.setState({ bIdx: idx - 1, bInstant: false });
}
}
}
renderVals() {
var self = this;
var s = this.state || {};
var h = s.hIdx || 0;
var nowD = new Date(s.now || Date.now());
var endD = new Date(nowD); endD.setHours(23, 59, 59, 999);
var rem = Math.max(0, Math.floor((endD - nowD) / 1000));
function pad(n) { return (n < 10 ? '0' : '') + n; }
var fH = pad(Math.floor(rem / 3600)), fM = pad(Math.floor((rem % 3600) / 60)), fS = pad(rem % 60);
var heroDots = [0, 1, 2, 3].map(function (i) {
return {
label: 'Ir a la diapositiva ' + (i + 1),
current: i === h ? 'true' : 'false',
w: i === h ? '32px' : '12px',
bg: i === h ? '#ff5f00' : 'rgba(255,255,255,0.6)',
pick: function () { self.setState({ hIdx: i }); }
};
});
return {
fH: fH, fM: fM, fS: fS,
menuOpen: !!s.menuOpen,
menuExpanded: s.menuOpen ? 'true' : 'false',
menuChevron: s.menuOpen ? '180deg' : '0deg',
toggleMenu: function (e) { self._menuToggle(e); },
goCat: function (e) { self._goCat(e); },
ofPrev: function (e) { try { var t = e.currentTarget.parentNode.querySelector('.oftrack'); t.scrollBy({ left: -Math.round(t.clientWidth * 0.8), behavior: 'smooth' }); } catch (_) {} },
ofNext: function (e) { try { var t = e.currentTarget.parentNode.querySelector('.oftrack'); t.scrollBy({ left: Math.round(t.clientWidth * 0.8), behavior: 'smooth' }); } catch (_) {} },
heroPlaying: !s.hStopped,
heroStopped: !!s.hStopped,
heroToggleLabel: s.hStopped ? 'Reanudar el carrusel' : 'Pausar el carrusel',
heroToggle: function () { self.setState({ hStopped: !self.state.hStopped }); },
heroShift: h * 25,
heroDots: heroDots,
heroNext: function () { self.setState({ hIdx: (h + 1) % 4 }); },
heroPrev: function () { self.setState({ hIdx: (h + 3) % 4 }); },
heroPause: function () { self.setState({ hPaused: true }); },
heroResume: function () { self.setState({ hPaused: false }); },
brandShift: (s.bIdx || 0) * 204,
brandTrans: s.bInstant ? 'none' : 'transform 500ms ease',
brandNext: function () { self.brandGo(1); },
brandPrev: function () { self.brandGo(-1); },
brandPause: function () { self.setState({ bPaused: true }); },
brandResume: function () { self.setState({ bPaused: false }); }
};
}
}
